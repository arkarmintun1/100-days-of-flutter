# Day 94: Spendbook's CI. In a repo with only one app, drop `paths` and
# `working-directory`.
name: Spendbook (Day 94)

on:
  push:
    branches: [main]
    paths:
      - day94/spendbook/**
      - .github/workflows/day94_spendbook.yml
  pull_request:
    paths:
      - day94/spendbook/**
      - .github/workflows/day94_spendbook.yml
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: day94/spendbook

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true # the Flutter SDK and the pub cache

      - run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code

      - name: Formatted
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - run: flutter analyze

      # Golden files are made on macOS (Day 88): skip them on Linux.
      - name: Tests
        run: flutter test --coverage -x golden

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: day94/spendbook/coverage/lcov.info

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: day94/spendbook/firestore-tests/package-lock.json

      # The Firestore emulator runs on Java 21 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm install -g firebase-tools@15.31.0
      - run: npm ci --prefix firestore-tests
      - run: >-
          firebase emulators:exec --only firestore --project demo-spendbook
          "npm --prefix firestore-tests test"

  android:
    name: Android build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >-
          flutter build apk --release --flavor prod
          --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v7
        with:
          name: spendbook-prod-release-apk
          path: day94/spendbook/build/app/outputs/flutter-apk/app-prod-release.apk
