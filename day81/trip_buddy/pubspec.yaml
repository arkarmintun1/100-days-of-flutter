name: trip_buddy
description: "Trip Buddy - an AI travel companion with RAG (100 Days of Flutter, Days 75-85)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  firebase_core: ^5.1.0
  firebase_app_check: ^0.5.1
  cloud_functions: ^7.0.1
  drift: ^2.35.3
  characters: ^1.4.1
  drift_flutter: ^0.3.1
  firebase_ai: ^5.1.0
  file_selector: ^1.1.0
  http: ^1.6.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  google_maps_flutter: ^2.19.0
  google_maps_flutter_ios_sdk9: ^2.19.0
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.2
  sqlite3: ^3.8.0
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true
