# Day 98: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  # Android 8+: a foreground on a background color, in the shape the
  # phone's launcher picks (circle, squircle, ...).
  adaptive_icon_background: "#00796B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  # The App Store doesn't take icons with transparency.
  remove_alpha_ios: true
