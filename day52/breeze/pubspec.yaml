name: breeze
description: "Breeze - a live weather app (100 Days of Flutter, Days 49-54)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  geolocator: ^14.1.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - .env
