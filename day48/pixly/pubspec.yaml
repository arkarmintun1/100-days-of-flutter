name: pixly
description: "Pixly - a Pexels photo discovery app (100 Days of Flutter, Days 25-40)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  flutter_dotenv: ^6.0.0
  dio: ^5.9.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  cached_network_image: ^4.0.5
  flutter_cache_manager: ^3.4.5
  shimmer: ^4.0.0
  url_launcher: ^6.3.3
  go_router: ^18.1.1
  shared_preferences: ^2.5.5
  riverpod_sqflite: ^0.4.7
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file: ^7.0.1
  fake_async: ^1.3.3
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/svg/
    - assets/fonts/OFL.txt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
